name: CI - Code Quality Check

on:
  pull_request:
    branches: [ "master", "main", "sub-frontend", "frontend", "backend" ]
  push:
    branches: [ "master", "main", "sub-frontend", "frontend", "backend" ]

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.modified, 'frontend/') || contains(github.event.head_commit.added, 'frontend/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Check
        run: |
          cd frontend
          npm run lint

      - name: Build Check
        run: |
          cd frontend
          npm run build

  backend-ci:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.modified, 'backend/') || contains(github.event.head_commit.added, 'backend/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven Verify
        run: |
          cd backend
          mvn clean verify -DskipTests
